[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stephen-ai-cowork"
version = "0.1.0"
description = "Stephen's AI cowork system: agents, skills, and defense AI project scaffolding for HII/DLA, GMU SEOR PhD, and portfolio work."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stephen" }]
keywords = ["defense", "ai", "data-science", "supply-chain", "critical-materials", "cowork"]

dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "scipy>=1.11.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.0",
  "click>=8.1.7",
  "rich>=13.7.0",
  "jinja2>=3.1.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8.0", "seaborn>=0.13.0", "plotly>=5.18.0"]
notebook = ["jupyterlab>=4.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "ruff>=0.3.0"]

[project.scripts]
cowork = "cowork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
